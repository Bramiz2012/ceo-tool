    <!-- ⚡ DÜYMƏLƏRİ İŞLƏDƏN JAVASCRIPT KODLARI ⚡ -->
    <script>
        // OYUN DƏYİŞƏNLƏRİ (XALLAR VƏ QİYMƏTLƏR)
        let score = 0;
        let clickPower = 1;
        let autoClickers = 0;
        let up1Cost = 30;
        let up2Cost = 100;

        // ELEMENTLƏRİ SEÇMƏK
        const scoreDisplay = document.getElementById("scoreDisplay");
        const playerLeaderboardScore = document.getElementById("playerLeaderboardScore");
        const up1Btn = document.getElementById("up1Btn");
        const up2Btn = document.getElementById("up2Btn");
        const upgrade1CostStyle = document.getElementById("upgrade1Cost");
        const upgrade2CostStyle = document.getElementById("upgrade2Cost");

        // EKRANI YENİLƏMƏ FUNKSİYASI
        function updateUI() {
            if(scoreDisplay) scoreDisplay.innerText = score;
            if(playerLeaderboardScore) playerLeaderboardScore.innerText = score + " Xal";

            // Mağaza Düymələrinin Rəngini və Mətnini Yoxlamaq
            if (score >= up1Cost) {
                if(up1Btn) { up1Btn.className = "shop-btn btn-green"; up1Btn.innerText = "Satın Al"; }
            } else {
                if(up1Btn) { up1Btn.className = "shop-btn btn-red"; up1Btn.innerText = "Balans Çatmır"; }
            }

            if (score >= up2Cost) {
                if(up2Btn) { up2Btn.className = "shop-btn btn-green"; up2Btn.innerText = "Satın Al"; }
            } else {
                if(up2Btn) { up2Btn.className = "shop-btn btn-red"; up2Btn.innerText = "Balans Çatmır"; }
            }
        }

        // ALƏT 1: NICKNAME GENERATOR (AD YARATMAQ)
        window.generateRandomNicknames = function() {
            const input = document.getElementById("nickInput").value.trim();
            const output = document.getElementById("nickOutput");
            
            if (input === "") {
                output.innerHTML = "<span style='color: #ff3333;'>Zəhmət olmasa bir ad daxil edin!</span>";
                return;
            }

            const prefixes = ["⚡X_", "Cyber_", "CEO_", "Vortex_", "Alpha_"];
            const suffixes = ["_⚔️", "_Gladiator", "_99", "_Pro", "_Ghost"];
            
            let htmlContent = "";
            for (let i = 0; i < 3; i++) {
                let randomPref = prefixes[Math.floor(Math.random() * prefixes.length)];
                let randomSuff = suffixes[Math.floor(Math.random() * suffixes.length)];
                let generatedNick = randomPref + input + randomSuff;
                
                htmlContent += `
                    <div class="nick-row">
                        <span>${generatedNick}</span>
                        <button class="copy-btn" onclick="window.copyToClipboard('${generatedNick}')">Kopyala</button>
                    </div>`;
            }
            output.innerHTML = htmlContent;
        };

        // KOPYALAMA FUNKSİYASI
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert("Ləqəb kopyalandı: " + text);
            });
        };

        // ALƏT 2: KLİKLƏMƏ FUNKSİYASI (KLİKLƏ DÜYMƏSİ)
        window.clickButton = function() {
            score += clickPower;
            updateUI();
        };

        // MAĞAZA: GÜCLƏNDİRİCİ 1 (SUPER KLİK)
        window.buyUpgrade1 = function() {
            if (score >= up1Cost) {
                score -= up1Cost;
                clickPower += 2;
                up1Cost = Math.round(up1Cost * 1.5);
                if(upgrade1CostStyle) upgrade1CostStyle.innerText = up1Cost;
                updateUI();
            }
        };

        // MAĞAZA: GÜCLƏNDİRİCİ 2 (AVTO KLİK)
        window.buyUpgrade2 = function() {
            if (score >= up2Cost) {
                score -= up2Cost;
                autoClickers++;
                up2Cost = Math.round(up2Cost * 1.7);
                if(upgrade2CostStyle) upgrade2CostStyle.innerText = up2Cost;
                updateUI();
            }
        };

        // AVTO-KLİK PROSESİ (HƏR SANİYƏ AVTOMATİK XAL VERİR)
        setInterval(function() {
            if (autoClickers > 0) {
                score += autoClickers;
                updateUI();
            }
        }, 1000);

        // CEO ŞANS ÇARXI FUNKSİYASI
        let isSpinning = false;
        window.spinWheel = function() {
            if (isSpinning) return;
            isSpinning = true;
            
            const status = document.getElementById("wheelStatus");
            const prizes = [50, 100, -20, 200, 0, -50];
            const animations = ["🎰 🔄 CHURNING...", "🎰 ⚡ MATRIX...", "🎰 🔥 ROLLING..."];
            
            let animCount = 0;
            let interval = setInterval(() => {
                if(status) status.innerText = animations[animCount % animations.length];
                animCount++;
            }, 150);

            setTimeout(() => {
                clearInterval(interval);
                let randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
                
                if(status) {
                    if (randomPrize > 0) {
                        score += randomPrize;
                        status.innerHTML = `🎉 Qazandınız: <span style="color:#00ff00;">+${randomPrize} Xal</span>!`;
                    } else if (randomPrize < 0) {
                        score = Math.max(0, score + randomPrize);
                        status.innerHTML = `💀 Şanssızlıq: <span style="color:#ff3333;">${randomPrize} Xal</span>!`;
                    } else {
                        status.innerHTML = `😐 Boş keçdi! Növbəti səfərə.`;
                    }
                }
                
                isSpinning = false;
                updateUI();
            }, 1500);
        };
    </script>
</body>
</html>
